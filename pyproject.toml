[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instapuller"
version = "0.2.0"
description = "Anonymous Instagram video/Reel download and metrics tool for local applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "yt-dlp==2026.11.23",
]

[project.scripts]
instapuller = "instapuller.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
